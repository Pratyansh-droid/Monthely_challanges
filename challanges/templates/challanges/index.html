{% extends "base.html" %}
{% load static %}

{% block css_file %}
    <link rel="stylesheet" href="{% static "challanges/index.css" %}">
    <link rel="stylesheet" href="{% static "challanges/include/header.css" %}">
{% endblock %}

{% block page_title %}All Challanges{% endblock %}
{% block content %}
    {% include "./include/header.html" %}

    <ul>
        {% for month in months %}
            <li><a href="{% url "month-challange" month %}">{{ month|title }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
